services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: saveinator-prometheus
    network_mode: host
    restart: unless-stopped
    mem_limit: 300m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.listen-address=127.0.0.1:9091
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: saveinator-alertmanager
    network_mode: host
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    container_name: saveinator-grafana
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_ROOT_URL: https://saveinator.xdshka.party/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: saveinator-node-exporter
    network_mode: host
    restart: unless-stopped
    pid: host
    mem_limit: 64m
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: saveinator-postgres-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: postgresql://saveinator:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/saveinator?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - saveinator_app

  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: saveinator-redis-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - saveinator_app

networks:
  saveinator_app:
    external: true
    name: saveinator_default

volumes:
  prometheus-data:
  grafana-data:
