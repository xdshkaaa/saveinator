[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.api", "bot.handlers", "bot.middleware", "bot.services", "workers", "db"]

[project]
name = "save-yt-tiktok"
version = "0.1.0"
description = "Telegram bot for downloading videos from YouTube, TikTok, and Instagram"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.7,<4",
    "aiohttp>=3.9",
    "yt-dlp>=2024.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "prometheus-client>=0.21",
    "pinterest-dl>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis[lua]>=2.21",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
