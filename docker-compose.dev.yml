version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saveinator
      POSTGRES_USER: saveinator
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-saveinator}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveinator"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://saveinator:${DEV_DB_PASSWORD:-saveinator}@db:5432/saveinator
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pgdata_dev:
