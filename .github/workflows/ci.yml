name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.3"
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out

  migrate-image:
    name: Migrate Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/migrate/Dockerfile .

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci
      BOT_TOKEN: ci
      PINTEREST_BOT_TOKEN: ci
      PINTEREST_KZ_BOT_TOKEN: ci
      SPOTIFY_BOT_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  locales:
    name: Locale parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-parity.sh
