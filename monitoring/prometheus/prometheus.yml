global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9091

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          instance: saveinator-vps

  - job_name: cadvisor
    static_configs:
      - targets:
          - 127.0.0.1:8180

  - job_name: saveinator-bot
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9101
        labels:
          service: bot

  - job_name: saveinator-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9102
        labels:
          service: worker

  - job_name: postgres
    static_configs:
      - targets:
          - 127.0.0.1:9187

  - job_name: redis
    static_configs:
      - targets:
          - 127.0.0.1:9121

  - job_name: loki
    static_configs:
      - targets:
          - 127.0.0.1:3100

  - job_name: promtail
    static_configs:
      - targets:
          - 127.0.0.1:9080
