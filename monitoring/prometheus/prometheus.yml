global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9091

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          instance: saveinator-vps

  - job_name: saveinator-bot
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9101
        labels:
          service: bot

  - job_name: saveinator-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9102
        labels:
          service: worker

  # botd exposes all fleet bots on one endpoint; per-bot series carry the
  # "bot" label (saveinator_bot_*).
  - job_name: saveinator-botd
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9106
        labels:
          service: botd

  - job_name: postgres
    static_configs:
      - targets:
          - 127.0.0.1:9187

  - job_name: redis
    static_configs:
      - targets:
          - 127.0.0.1:9121
