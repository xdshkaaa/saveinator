services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saveinator
      POSTGRES_USER: saveinator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveinator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: docker/webhook/Dockerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://saveinator:${DB_PASSWORD:-changeme}@db:5432/saveinator
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_POLLING: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_API_TIMEOUT_SECONDS: ${SPOTIFY_API_TIMEOUT_SECONDS:-15}
      SPOTIFY_DOWNLOAD_ENABLED: ${SPOTIFY_DOWNLOAD_ENABLED:-true}
      SPOTIFY_TRACK_TIMEOUT_SECONDS: ${SPOTIFY_TRACK_TIMEOUT_SECONDS:-15}
      SPOTIFY_DL_OUTPUT_FORMAT: ${SPOTIFY_DL_OUTPUT_FORMAT:-mp3}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: "9101"
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://saveinator:${DB_PASSWORD:-changeme}@db:5432/saveinator
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      WORKER_METRICS_PORT: "9102"
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
