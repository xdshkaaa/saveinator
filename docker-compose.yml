services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saveinator
      POSTGRES_USER: saveinator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
    ports:
      # loopback only: dash (host network) and ops tooling connect here.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveinator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # loopback only: dash (host network) and ops tooling connect here.
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  saveinator:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://saveinator:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/saveinator
      REDIS_URL: redis://redis:6379/0
      SAVEINATOR_MODE: all
      USE_POLLING: "${USE_POLLING:-false}"
      WEBHOOK_HOST: "${WEBHOOK_HOST:-https://saveinator-hooks.xdshka.party}"
      WEBHOOK_PATH: "${WEBHOOK_PATH:-/webhook}"
      WEBHOOK_PORT: "${WEBHOOK_PORT:-8000}"
      WEBHOOK_LISTEN: "${WEBHOOK_LISTEN:-0.0.0.0}"
      WEBHOOK_SECRET_TOKEN: "${WEBHOOK_SECRET_TOKEN:-}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOWNLOAD_TIMEOUT_SECONDS: ${DOWNLOAD_TIMEOUT_SECONDS:-60}
      SEND_VIDEO_LIMIT_MB: ${SEND_VIDEO_LIMIT_MB:-50}
      SEND_DOCUMENT_LIMIT_MB: ${SEND_DOCUMENT_LIMIT_MB:-1999}
      YOUTUBE_MAX_FILE_SIZE_MB: ${YOUTUBE_MAX_FILE_SIZE_MB:-1999}
      YOUTUBE_DOWNLOAD_TIMEOUT_SECONDS: ${YOUTUBE_DOWNLOAD_TIMEOUT_SECONDS:-600}
      TIKTOK_COOKIES_PATH: ${TIKTOK_COOKIES_PATH:-/secrets/tiktok_cookies.txt}
      TIKTOK_CAROUSEL_MAX_ITEMS: ${TIKTOK_CAROUSEL_MAX_ITEMS:-20}
      TIKTOK_CAROUSEL_AUDIO_ENABLED: ${TIKTOK_CAROUSEL_AUDIO_ENABLED:-true}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_API_TIMEOUT_SECONDS: ${SPOTIFY_API_TIMEOUT_SECONDS:-15}
      SPOTIFY_DOWNLOAD_ENABLED: ${SPOTIFY_DOWNLOAD_ENABLED:-true}
      SPOTIFY_TRACK_TIMEOUT_SECONDS: ${SPOTIFY_TRACK_TIMEOUT_SECONDS:-60}
      SPOTIFY_DL_OUTPUT_FORMAT: ${SPOTIFY_DL_OUTPUT_FORMAT:-mp3}
      SPOTIFY_LOCK_MAX_TRACKS: ${SPOTIFY_LOCK_MAX_TRACKS:-50}
      SPOTIFY_DOWNLOAD_CONCURRENCY: ${SPOTIFY_DOWNLOAD_CONCURRENCY:-2}
      SOUNDCLOUD_ENABLED: ${SOUNDCLOUD_ENABLED:-true}
      SOUNDCLOUD_DOWNLOAD_ENABLED: ${SOUNDCLOUD_DOWNLOAD_ENABLED:-false}
      SOUNDCLOUD_TRACK_TIMEOUT_SECONDS: ${SOUNDCLOUD_TRACK_TIMEOUT_SECONDS:-30}
      SOUNDCLOUD_MAX_TRACKS: ${SOUNDCLOUD_MAX_TRACKS:-100}
      SOUNDCLOUD_DL_OUTPUT_FORMAT: ${SOUNDCLOUD_DL_OUTPUT_FORMAT:-mp3}
      SOUNDCLOUD_DOWNLOAD_CONCURRENCY: ${SOUNDCLOUD_DOWNLOAD_CONCURRENCY:-1}
      # Empty YANDEX_MUSIC_ENABLED keeps token-based auto-enable semantics.
      YANDEX_MUSIC_ENABLED: ${YANDEX_MUSIC_ENABLED:-}
      YANDEX_MUSIC_ACCESS_TOKEN: ${YANDEX_MUSIC_ACCESS_TOKEN:-}
      YANDEX_MUSIC_API_TIMEOUT_SECONDS: ${YANDEX_MUSIC_API_TIMEOUT_SECONDS:-15}
      YANDEX_MUSIC_DOWNLOAD_ENABLED: ${YANDEX_MUSIC_DOWNLOAD_ENABLED:-true}
      YANDEX_MUSIC_TRACK_TIMEOUT_SECONDS: ${YANDEX_MUSIC_TRACK_TIMEOUT_SECONDS:-60}
      YANDEX_MUSIC_DL_OUTPUT_FORMAT: ${YANDEX_MUSIC_DL_OUTPUT_FORMAT:-mp3}
      YANDEX_MUSIC_LOCK_MAX_TRACKS: ${YANDEX_MUSIC_LOCK_MAX_TRACKS:-50}
      YANDEX_MUSIC_DOWNLOAD_CONCURRENCY: ${YANDEX_MUSIC_DOWNLOAD_CONCURRENCY:-2}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: "9101"
      WORKER_METRICS_PORT: "9102"
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-0}
      DOWNLOAD_API_ENABLED: ${DOWNLOAD_API_ENABLED:-true}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      INTERNAL_API_RATE_PER_MINUTE: ${INTERNAL_API_RATE_PER_MINUTE:-10}
      SPAM_DEDUP_WINDOW_SECONDS: ${SPAM_DEDUP_WINDOW_SECONDS:-300}
      YOUTUBE_TRANSCODE_ENABLED: ${YOUTUBE_TRANSCODE_ENABLED:-true}
      TIKTOK_COOKIES_REFRESH_ENABLED: ${TIKTOK_COOKIES_REFRESH_ENABLED:-true}
      TIKTOK_COOKIES_REFRESH_URL: ${TIKTOK_COOKIES_REFRESH_URL:-https://vt.tiktok.com/ZSCFGyN3g/}
      TIKTOK_REFERER: ${TIKTOK_REFERER:-https://www.tiktok.com/}
      INSTAGRAM_ENABLED: ${INSTAGRAM_ENABLED:-true}
      INSTAGRAM_DOWNLOAD_TIMEOUT_SECONDS: ${INSTAGRAM_DOWNLOAD_TIMEOUT_SECONDS:-60}
      INSTAGRAM_MAX_FILE_SIZE_MB: ${INSTAGRAM_MAX_FILE_SIZE_MB:-50}
      INSTAGRAM_COOKIES_PATH: ${INSTAGRAM_COOKIES_PATH:-/secrets/instagram_cookies.txt}
      INSTAGRAM_COOKIES_FROM_BROWSER: ${INSTAGRAM_COOKIES_FROM_BROWSER:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9101:9101"
      - "127.0.0.1:9102:9102"
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # botd runs every bot from bots.yaml in one process: one webhook port,
  # one metrics port, /webhook/{slug} per bot.
  botd:
    build:
      context: .
      dockerfile: docker/go/Dockerfile.botd
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PINTEREST_BOT_TOKEN: ${PINTEREST_BOT_TOKEN:?set PINTEREST_BOT_TOKEN}
      PINTEREST_KZ_BOT_TOKEN: ${PINTEREST_KZ_BOT_TOKEN:?set PINTEREST_KZ_BOT_TOKEN}
      SPOTIFY_BOT_TOKEN: ${SPOTIFY_BOT_TOKEN:?set SPOTIFY_BOT_TOKEN}
      SOUNDCLOUD_BOT_TOKEN: ${SOUNDCLOUD_BOT_TOKEN:?set SOUNDCLOUD_BOT_TOKEN}
      # config.Load still requires BOT_TOKEN; unused by fleet bots themselves.
      BOT_TOKEN: ${PINTEREST_BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://saveinator:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/saveinator
      REDIS_URL: redis://redis:6379/0
      SAVEINATOR_MODE: all
      USE_POLLING: "${BOTD_USE_POLLING:-false}"
      WEBHOOK_HOST: "${BOTD_WEBHOOK_HOST:-${WEBHOOK_HOST:-https://saveinator-hooks.xdshka.party}}"
      WEBHOOK_PORT: "${BOTD_WEBHOOK_PORT:-8005}"
      WEBHOOK_LISTEN: "${WEBHOOK_LISTEN:-0.0.0.0}"
      WEBHOOK_SECRET_TOKEN: "${WEBHOOK_SECRET_TOKEN:-}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PINTEREST_ENABLED: ${PINTEREST_ENABLED:-true}
      PINTEREST_TIMEOUT_SECONDS: ${PINTEREST_TIMEOUT_SECONDS:-30}
      PINTEREST_MAX_ITEMS: ${PINTEREST_MAX_ITEMS:-10}
      PINTEREST_DOWNLOAD_IMAGES: ${PINTEREST_DOWNLOAD_IMAGES:-true}
      PINTEREST_DOWNLOAD_VIDEOS: ${PINTEREST_DOWNLOAD_VIDEOS:-true}
      PINTEREST_COOKIES_PATH: ${PINTEREST_COOKIES_PATH:-}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_API_TIMEOUT_SECONDS: ${SPOTIFY_API_TIMEOUT_SECONDS:-15}
      SPOTIFY_DOWNLOAD_ENABLED: ${SPOTIFY_DOWNLOAD_ENABLED:-true}
      SPOTIFY_TRACK_TIMEOUT_SECONDS: ${SPOTIFY_TRACK_TIMEOUT_SECONDS:-60}
      SPOTIFY_DL_OUTPUT_FORMAT: ${SPOTIFY_DL_OUTPUT_FORMAT:-mp3}
      SPOTIFY_LOCK_MAX_TRACKS: ${SPOTIFY_LOCK_MAX_TRACKS:-50}
      SPOTIFY_DOWNLOAD_CONCURRENCY: ${SPOTIFY_DOWNLOAD_CONCURRENCY:-2}
      SOUNDCLOUD_ENABLED: ${SOUNDCLOUD_ENABLED:-true}
      SOUNDCLOUD_DOWNLOAD_ENABLED: ${SOUNDCLOUD_DOWNLOAD_ENABLED:-true}
      SOUNDCLOUD_TRACK_TIMEOUT_SECONDS: ${SOUNDCLOUD_TRACK_TIMEOUT_SECONDS:-30}
      SOUNDCLOUD_MAX_TRACKS: ${SOUNDCLOUD_MAX_TRACKS:-100}
      SOUNDCLOUD_DL_OUTPUT_FORMAT: ${SOUNDCLOUD_DL_OUTPUT_FORMAT:-mp3}
      SOUNDCLOUD_DOWNLOAD_CONCURRENCY: ${SOUNDCLOUD_DOWNLOAD_CONCURRENCY:-1}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: "9106"
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-0}
      DOWNLOAD_API_ENABLED: ${DOWNLOAD_API_ENABLED:-true}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      INTERNAL_API_RATE_PER_MINUTE: ${INTERNAL_API_RATE_PER_MINUTE:-10}
      SPAM_DEDUP_WINDOW_SECONDS: ${SPAM_DEDUP_WINDOW_SECONDS:-300}
    ports:
      - "127.0.0.1:8005:8005"
      - "127.0.0.1:9106:9106"
    volumes:
      - ./secrets:/secrets:ro
      - ./bots.yaml:/app/bots.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # dash serves the operator dashboard (dash-saveinator.xdshka.party):
  # stats across every service plus the full user table. Read-only consumer
  # of Postgres/Redis except the test_urls table (dash writes the admin's
  # URL test checklist; the saveinator worker executes it). Runs in host
  # network mode so it can probe the
  # host-network monitoring stack (prometheus, grafana, exporters) on the
  # loopback; binds 127.0.0.1:9000 only.
  dash:
    build:
      context: .
      dockerfile: docker/dash/Dockerfile
    network_mode: host
    environment:
      DATABASE_URL: postgres://saveinator:${DB_PASSWORD:?set DB_PASSWORD}@127.0.0.1:5432/saveinator?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      DASH_LISTEN: 127.0.0.1
      DASH_PORT: "9000"
      # Telegram Login: the bot token for the widget (defaults to BOT_TOKEN
      # inside the app) and the comma-separated allowlist of operator ids.
      DASH_TELEGRAM_TOKEN: "${DASH_TELEGRAM_TOKEN:-${BOT_TOKEN:-}}"
      DASH_ADMIN_IDS: "${DASH_ADMIN_IDS:-339193247}"
      # Service probes: app services and the monitoring stack all live on
      # the host loopback in host-network mode.
      DASH_SERVICE_PROBES: "${DASH_SERVICE_PROBES:-saveinator=http://127.0.0.1:8000/health;saveinator_metrics=http://127.0.0.1:9101/metrics;worker_metrics=http://127.0.0.1:9102/metrics;botd=http://127.0.0.1:8005/health;botd_metrics=http://127.0.0.1:9106/metrics;prometheus=http://127.0.0.1:9091/-/healthy;grafana=http://127.0.0.1:3000/api/health;node_exporter=http://127.0.0.1:9100/metrics;postgres_exporter=http://127.0.0.1:9187/metrics;redis_exporter=http://127.0.0.1:9121/metrics;loki=http://127.0.0.1:3100/loki/api/v1/status/buildinfo;promtail=http://127.0.0.1:9080/ready;cadvisor=http://127.0.0.1:8180/healthz}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://saveinator:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/saveinator
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pgdata:
